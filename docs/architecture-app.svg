<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Architecture applicative de TaskFlow</title>
<desc>S3 vers Cognito et API Gateway, API Gateway vers Lambda, Lambda vers DynamoDB, CloudWatch et SNS en supervision.</desc>
