<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Pipeline CI/CD de TaskFlow</title>
<desc>git push déclenche GitHub Actions, qui lance Terraform apply et le build du frontend en parallèle, déployant l'infrastructure AWS et le frontend sur S3.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="360" fill="#FFFFFF"/>

<line x1="340" y1="76" x2="340" y2="100" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow2)"/>
<path d="M340,156 L340,168 L220,168 L220,180" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow2)"/>
<path d="M340,156 L340,168 L460,168 L460,180" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow2)"/>
<line x1="220" y1="236" x2="220" y2="260" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow2)"/>
<line x1="460" y1="236" x2="460" y2="260" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow2)"/>

<g>
<rect x="240" y="20" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="340" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Développeur</text>
<text x="340" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">Commande : git push</text>
</g>

<g>
<rect x="240" y="100" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="340" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">GitHub Actions</text>
<text x="340" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">Pipeline CI/CD</text>
</g>

<g>
<rect x="120" y="180" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="220" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#26215C">Terraform apply</text>
<text x="220" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Provisionne AWS</text>
</g>

<g>
<rect x="360" y="180" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="460" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#04342C">Build frontend</text>
<text x="460" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">npm run build</text>
</g>

<g>
<rect x="120" y="260" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
<text x="220" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#042C53">Infrastructure AWS</text>
<text x="220" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0C447C">6 services AWS déployés</text>
</g>

<g>
<rect x="360" y="260" width="200" height="56" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
<text x="460" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#173404">Déploiement S3</text>
<text x="460" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27500A">aws s3 sync --delete</text>
</g>
</svg>
